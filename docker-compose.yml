# Bases de datos de PersonAPP para desarrollo local.
# Credenciales y puertos iguales a los application.properties de rest-input-adapter y cli-input-adapter.
# Los scripts de /scripts se ejecutan solo la primera vez (volumen vacío), en orden DDL -> DML.
# Para reinicializar: docker compose down -v && docker compose up -d
# Persona 2 agregará aquí los servicios de las apps (REST y CLI) con sus Dockerfiles.

services:
  mariadb:
    image: mariadb:10.11
    container_name: personapp-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/1_persona_ddl_maria.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/2_persona_dml_maria.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:6.0
    container_name: personapp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/1_persona_ddl_mongo.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/2_persona_dml_mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
  mongodb_data:
