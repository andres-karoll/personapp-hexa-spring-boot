<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: cabecera('Estudios')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main class="contenedor">
  <div th:replace="~{layout :: avisos}"></div>
  <h1>Estudios</h1>
  <div class="barra">
    <nav class="tabs">
      <a th:classappend="${db == 'MARIA' ? 'activo' : ''}" th:href="@{/web/estudios(db='MARIA')}">MariaDB</a>
      <a th:classappend="${db == 'MONGO' ? 'activo' : ''}" th:href="@{/web/estudios(db='MONGO')}">MongoDB</a>
    </nav>
    <a class="boton primario" th:href="@{/web/estudios/nuevo(db=${db})}">Nuevo estudio</a>
  </div>
  <table>
    <thead>
      <tr><th>Cédula</th><th>Profesión</th><th>Fecha de grado</th><th>Universidad</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="e : ${estudios}">
        <td th:text="${e.dniPersona}">123456789</td>
        <td th:text="${e.idProfesion}">1</td>
        <td th:text="${e.fecha}">2015-06-30</td>
        <td th:text="${e.universidad}">Universidad</td>
        <td class="acciones">
          <a th:href="@{/web/estudios/{db}/{dni}/{prof}/editar(db=${db},dni=${e.dniPersona},prof=${e.idProfesion})}">Editar</a>
          <a class="enlace-peligro" th:href="@{/web/estudios/{db}/{dni}/{prof}/eliminar(db=${db},dni=${e.dniPersona},prof=${e.idProfesion})}">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="secundario" th:if="${#lists.isEmpty(estudios)}">No hay estudios registrados en <span th:text="${dbNombre}">MariaDB</span>.</p>
</main>
</body>
</html>
