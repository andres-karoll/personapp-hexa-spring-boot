<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: cabecera('Eliminar profesión')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main class="contenedor">
  <h1>Eliminar profesión</h1>
  <div class="tarjeta">
    <p>Vas a eliminar la profesión <strong th:text="${profesion.nombre}">Nombre</strong>
      (id <span th:text="${profesion.id}">1</span>) de <span th:text="${dbNombre}">MariaDB</span>.</p>
    <p class="secundario">También se eliminan los estudios asociados a esta profesión. Esta acción no se puede deshacer.</p>
    <form method="post" th:action="@{/web/profesiones/{db}/{id}/eliminar(db=${db},id=${id})}">
      <div class="acciones-formulario">
        <button class="peligro" type="submit">Eliminar</button>
        <a th:href="@{/web/profesiones(db=${db})}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
