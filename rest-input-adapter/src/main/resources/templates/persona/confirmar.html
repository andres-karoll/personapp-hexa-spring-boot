<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: cabecera('Eliminar persona')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main class="contenedor">
  <h1>Eliminar persona</h1>
  <div class="tarjeta">
    <p>Vas a eliminar a <strong th:text="${persona.firstName + ' ' + persona.lastName}">Nombre</strong>
      (cédula <span th:text="${persona.dni}">123</span>) de <span th:text="${dbNombre}">MariaDB</span>.</p>
    <p class="secundario">También se eliminan sus teléfonos y estudios. Esta acción no se puede deshacer.</p>
    <form method="post" th:action="@{/web/personas/{db}/{id}/eliminar(db=${db},id=${id})}">
      <div class="acciones-formulario">
        <button class="peligro" type="submit">Eliminar</button>
        <a th:href="@{/web/personas(db=${db})}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
