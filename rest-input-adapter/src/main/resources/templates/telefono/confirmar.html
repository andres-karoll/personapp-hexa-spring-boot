<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: cabecera('Eliminar teléfono')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main class="contenedor">
  <h1>Eliminar teléfono</h1>
  <div class="tarjeta">
    <p>Vas a eliminar el teléfono <strong th:text="${telefono.numero}">3001112233</strong>
      de <span th:text="${dbNombre}">MariaDB</span>.</p>
    <p class="secundario">Esta acción no se puede deshacer.</p>
    <form method="post" th:action="@{/web/telefonos/{db}/{numero}/eliminar(db=${db},numero=${numero})}">
      <div class="acciones-formulario">
        <button class="peligro" type="submit">Eliminar</button>
        <a th:href="@{/web/telefonos(db=${db})}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
